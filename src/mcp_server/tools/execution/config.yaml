category_name: "Command Execution"
emoji: "⚡"
category_name_zh: "命令执行"
category_description: "Secure allowlist-based command execution: run whitelisted commands with argument sanitization, timeout protection, output size limits and audit logging; manage the persistent command allowlist"
enabled: true

# Security model:
#   - The allowlist starts EMPTY: run_command refuses everything until commands
#     are explicitly added via add_allowed_commands.
#   - Arguments are sanitized (no shell, dangerous chars/patterns rejected).
#   - Timeouts are capped and output size is limited.
#   - The allowlist persists in ~/.oh-my-mcp/execution_config.json.
