[project]
name = "oh-my-mcp"
version = "1.1.0"
description = "oh-my-mcp - MCP server with 154 practical tools across 11 categories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "quyansiyuanwang", email = "qysyw-team@qq.com" }]

keywords = [
    "mcp",
    "model-context-protocol",
    "tools",
    "web-search",
    "file-operations",
    "data-processing",
    "system-utilities",
    "ai-orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp>=2.14.5",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=1.0.0",
    "python-dateutil>=2.8.2",
    "psutil>=5.9.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pyinstaller>=6.18.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pyperclip>=1.8",
    "pygetwindow>=0.0.9",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/quyansiyuanwang/oh-my-mcp"
Documentation = "https://github.com/quyansiyuanwang/oh-my-mcp/tree/main/docs"
Repository = "https://github.com/quyansiyuanwang/oh-my-mcp.git"
Issues = "https://github.com/quyansiyuanwang/oh-my-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
browser = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
]
computer = [
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pyperclip>=1.8",
    "pygetwindow>=0.0.9",
    "pillow>=10.0",
]

[project.scripts]
oh-my-mcp = "mcp_server.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule selection so new ruff releases cannot silently change what CI enforces.
select = [
  "E4", "E7", "E9",  # pycodestyle errors
  "F",               # pyflakes
  "I",               # import order (mirrors the isort CI step)
  "UP",              # pyupgrade
  "B",               # flake8-bugbear
  "SIM",             # flake8-simplify
  "RUF",             # ruff-specific
]
ignore = [
  "BLE001",          # defensive broad catches ARE the error-handling design
  "DTZ005", "DTZ006",  # naive local datetimes are intended tool semantics
  "S110",            # try-except-pass used for optional probing
  "RUF012",          # mutable class defaults (validator allowlist sets)
  "RUF001", "RUF002", "RUF003",  # full-width punctuation in Chinese comments/strings
  "SIM117",          # nested with-statements keep patched context managers readable
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
exclude = ["build/", "dist/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["pyautogui", "mss", "mss.*", "pyperclip", "pygetwindow", "cv2"]
ignore_missing_imports = true

[tool.uv.workspace]
members = ["test_uv_project"]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "typer>=0.12",  # build-time only: mcp.cli imports it during PyInstaller collection
    "mypy>=1.19.1",
    "pyinstaller>=6.18.0",
    "pylint>=4.0.8",
    "pyright>=1.1.414",
    "types-psutil>=7.2.2.20260130",
    "types-python-dateutil>=2.9.0.20260124",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pylint.main]
py-version = "3.12"
ignore-paths = ["build", "dist", "tests/fixtures"]

[tool.pylint.format]
max-line-length = 120
max-module-lines = 2000

[tool.pylint.design]
max-args = 12
max-positional-arguments = 12
max-locals = 26
max-branches = 25
max-statements = 65
max-returns = 8
max-nested-blocks = 7
max-public-methods = 25

[tool.pylint.basic]
# Intentional names: module-level singletons, optional-dependency flags,
# MCP tool parameters mirroring external APIs, and local constants.
good-names-rgxs = [
    "_global_config",
    "_browser_config",
    "_search_manager",
    "_manager",
    "_config_available",
    "_selenium_available",
    "cv2",
    "pubDate",
    "do_GET",
    "MAX_DIFF_SIZE",
    "MAX_TEXT_LENGTH",
    "MAX_RESPONSE_SIZE",
    # mock classes mirror the camelCase APIs of pyautogui/pygetwindow
    "FAILSAFE",
    "PAUSE",
    "moveTo",
    "moveRel",
    "dragTo",
    "locateOnScreen",
    "MSS",
    "isActive",
    "isMinimized",
    "isMaximized",
    "resizeTo",
    "getAllWindows",
]

[tool.pylint."messages control"]
disable = [
  # Project design decisions:
  "logging-fstring-interpolation",  # W1203: f-string logging is the project style
  "broad-exception-caught",         # W0718: handlers deliberately never raise to the transport
  "import-outside-toplevel",        # C0415: lazy imports for optional dependencies
  "duplicate-code",                 # R0801: plugin handlers intentionally share structure
  "redefined-builtin",              # W0622: `format` is part of the public MCP tool API
  "global-statement",               # W0603: module-level singletons (managers, registry)
  "too-few-public-methods",
  # pytest conventions (tests/):
  "missing-function-docstring",     # test names document themselves
  "missing-class-docstring",        # test/mock classes
  "redefined-outer-name",           # fixture/shared mock names across modules
  "unused-argument",                # fixture arguments and patched signatures
  "wrong-import-position",          # sys.path bootstrap in test files
  "protected-access",               # tests reach into mocks/manager internals
]
