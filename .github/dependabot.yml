version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  # All updates are grouped into a single PR to keep noise low;
  # CI (lint + full test matrix) gates every bump.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
